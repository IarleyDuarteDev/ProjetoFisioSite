# Produção: tudo fica atrás do Caddy, que cuida do HTTPS (Let's Encrypt). Só as portas 80 e 443 são abertas.
# Uso: docker compose -f compose.prod.yaml --env-file .env.producao up -d --build
# Variáveis obrigatórias: veja docs/producao.md. Sem o Mailpit, sem Swagger e sem dados de demonstração.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fisio
      POSTGRES_USER: fisio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisio -d fisio"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fisio
      DB_USERNAME: fisio
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      CPF_KEY: ${CPF_KEY:?Defina CPF_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      FRONTEND_URL: https://${DOMINIO:?Defina DOMINIO}
      APP_PRODUCAO: "true"
      DEMO_DATA: "false"
      SWAGGER_ENABLED: "false"
      SMTP_HOST: ${SMTP_HOST:?Defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      SMTP_USERNAME: ${SMTP_USERNAME:?Defina SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Defina SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?Defina MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
